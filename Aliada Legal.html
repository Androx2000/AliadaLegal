// Traduce el texto libre de "¿necesita poder?" a un estado legible de un vistazo
const poderFlag = (txt = '') => {
  const t = txt.trim().toLowerCase();
  if (t.startsWith('no aplica')) return 'na';
  if (t.startsWith('es el poder')) return 'na';
  if (t.startsWith('depende')) return 'depende';
  if (t.startsWith('no')) return 'no';
  if (t.startsWith('sí') || t.startsWith('si')) return 'si';
  return 'depende';
};

const FLAG_META = {

  depende: { label: 'Depende de tu caso',          cls: 'bg-secondary text-foreground border-primary/20' },
  na:      { label: 'No aplica',                   cls: 'bg-slate-100 text-muted-foreground border-border' }
};

// Requisitos concretos para la combinación país + documento elegida en el asistente
function resolverRequisitos(pais, documento) {
  if (!pais || !documento) return null;
  const c = countryData[pais];
  if (!c) return null;
  if (documento === 'Antecedentes penales')
    return { tramite: c.antecedentes.tramite, poder: c.antecedentes.poder, requisitos: c.antecedentes.requisitos };
  if (documento === 'Partida de nacimiento')
    return { tramite: `Institución: ${c.nacimiento.institucion}`, poder: c.nacimiento.poder, requisitos: c.nacimiento.requisitos };
  if (documento === 'Poder notarial')
    return { tramite: `Se otorga ante: ${c.poderNotarial.donde}`, poder: 'Es el poder mismo — lo otorgas tú directamente', requisitos: 'Identificación vigente, datos del apoderado y descripción específica de los actos que autorizas' };
  const g = generalDocumentsData.find(d => d.documento === documento);
  return g ? { tramite: g.tramite, poder: g.poder, requisitos: g.requisitos } : null;
}

function PhoneField({ id, value, onChange, invalid }) {
  const ref = React.useRef(null);
  const iti = React.useRef(null);
  React.useEffect(() => {
    if (!ref.current || !window.intlTelInput) return;
    iti.current = window.intlTelInput(ref.current, {
      initialCountry: 'us',
      onlyCountries: ['us', 'sv', 'mx', 'gt', 'hn', 'co', 'ec', 'pe', 'ar'],
      separateDialCode: true,
      utilsScript: 'https://cdn.jsdelivr.net/npm/intl-tel-input@23.0.12/build/js/utils.js'
    });
    const el = ref.current;
    const notify = () => {
      const val = iti.current && iti.current.getNumber ? (iti.current.getNumber() || el.value) : el.value;
      const valid = iti.current ? iti.current.isValidNumber() : false;
      onChange(val, valid);
    };
    el.addEventListener('countrychange', notify);
    el.addEventListener('input', notify);
    return () => { 
      el.removeEventListener('countrychange', notify); 
      el.removeEventListener('input', notify); 
      if (iti.current) iti.current.destroy(); 
    };
  }, []);
  return (
    <input
      ref={ref} id={id} type="tel" inputMode="tel" defaultValue={value}
      className={cn(
        "flex h-10 w-full rounded-md border border-input bg-background px-3 py-2 text-sm ring-offset-background file:border-0 file:bg-transparent file:text-sm file:font-medium placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50",
        invalid && "border-destructive focus-visible:ring-destructive"
      )}
    />
  );
}

  };

  const enviar = () => {
    const e = {};
    if (f.nombre.trim().length < 3) e.nombre = 'Escribe tu nombre completo.';
    if (!emailOk(f.email)) e.email = 'Revisa el correo: falta el @ o el dominio.';
    if (!f.telefono || !f.telefonoValido) e.telefono = 'Escribe un número de teléfono válido para el país.';
    if (!termsAccepted) e.terms = "Debes aceptar los Términos y Condiciones para continuar.";
    setErr(e);
    if (Object.keys(e).length) return;
    
    const code = nuevoCodigo();
    onNuevoTramite(code, {
      cliente: f.nombre, pais: f.pais,
      servicio: f.documento, etapa: 0,
      actualizado: hoy(), fechaEstimada: fechaEstimada(),
      nota: 'Un asesor revisará tu caso y te escribirá por ' + (f.contacto === 'whatsapp' ? 'WhatsApp' : 'correo') + ' en menos de 24 horas.'
    });
    setCodigo(code);
    setPaso(2);
  };

                {i < paso ? '✓' : i + 1}
              </span>
              <span className={cn('text-xs sm:text-sm', i === paso ? 'font-semibold text-foreground' : 'text-muted-foreground', i !== paso && 'hidden sm:inline')}>{p}</span>
            </div>
            {i < PASOS.length - 1 && <span className="h-px flex-1 bg-line" aria-hidden="true" />}
          </React.Fragment>
        ))}
      </div>

      <div className="p-5 sm:p-7">
        <AnimatePresence mode="wait">
          {paso === 0 && (
            <motion.div key="p0" initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }} transition={{ duration: .3, ease: smoothEase }}>
              <h2 ref={encabezado} tabIndex={-1} className="font-display text-xl text-foreground sm:text-2xl">Empecemos por el documento</h2>
              <p className="mt-1 max-w-measure text-sm text-muted-foreground">Dinos qué necesitas y te mostramos, antes de pedirte nada más, qué hace falta para conseguirlo.</p>

              <div className="mt-5 grid gap-6 sm:gap-8 sm:grid-cols-2">
                <Field id="w-pais" label="País que emite el documento" error={err.pais}>
                  <Select id="w-pais" value={f.pais} invalid={!!err.pais} onChange={e => set('pais', e.target.value)}>
                    <option value="">Elige un país</option>
                    {PAISES.map(p => <option key={p}>{p}</option>)}
                  </Select>
                </Field>
                <Field id="w-doc" label="Documento que necesitas" error={err.documento}>
                  <Select id="w-doc" value={f.documento} invalid={!!err.documento} onChange={e => set('documento', e.target.value)}>
                    <option value="">Elige un documento</option>
                    {DOCUMENTOS.map(d => <option key={d}>{d}</option>)}

                </Field>
              </div>

              <AnimatePresence>
                {req && (
                  <motion.div initial={{ opacity: 0, height: 0 }} animate={{ opacity: 1, height: 'auto' }} exit={{ opacity: 0, height: 0 }}

                      </div>
                      <dl className="mt-3 space-y-2 text-sm">

                        <div><dt className="font-medium text-foreground">Lo que tendrás que darnos</dt><dd className="text-muted-foreground">{req.requisitos}</dd></div>

              </AnimatePresence>

              <div className="mt-6 flex flex-col gap-3 sm:flex-row sm:items-center">
                <Button variant="accent" size="lg" onClick={avanzar} className="sm:w-auto">Continuar</Button>

              </div>
            </motion.div>

          {paso === 1 && (
            <motion.div key="p1" initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }} transition={{ duration: .3, ease: smoothEase }}>
              <h2 ref={encabezado} tabIndex={-1} className="font-display text-xl text-foreground sm:text-2xl">¿Cómo te contactamos?</h2>
              <p className="mt-1 text-sm text-muted-foreground">

                    placeholder="tucorreo@ejemplo.com" onChange={e => set('email', e.target.value)} />

                <Field id="w-tel" label="Teléfono" hint="Incluye el código del país donde vives." error={err.telefono}>
                  <PhoneField id="w-tel" value={f.telefono} invalid={!!err.telefono} onChange={(v, valid) => { set('telefono', v); setF(p => ({...p, telefonoValido: valid})); }} />
                </Field>
                <fieldset>

              <div className="mt-6 pt-4 border-t border-border space-y-4">

function Progreso({ etapa }) {
  return (
    <ol className="mt-5 space-y-0 sm:flex sm:space-y-0">
      {ETAPAS.map((e, i) => {
        const hecho = i < etapa, actual = i === etapa;
        return (
          <li key={e} className="relative flex gap-3 pb-5 last:pb-0 sm:flex-1 sm:flex-col sm:gap-2 sm:pb-0">
            <div className="flex flex-col items-center sm:w-full sm:flex-row">
              <span className={cn('z-10 flex h-7 w-7 shrink-0 items-center justify-center rounded-full border-2 text-xs font-semibold',
                hecho ? 'border-primary bg-primary text-primary-foreground' : actual ? 'border-accent bg-accent text-foreground' : 'border-border bg-card text-muted-foreground')}>
                {hecho ? '✓' : i + 1}
              </span>
              <span className={cn('w-px flex-1 sm:h-px sm:w-full', i === ETAPAS.length - 1 ? 'bg-transparent' : hecho ? 'bg-primary' : 'bg-line')} aria-hidden="true" />
            </div>
            <p className={cn('pb-1 text-sm sm:pr-3', actual ? 'font-semibold text-foreground' : hecho ? 'text-foreground' : 'text-muted-foreground')}>
              {e}{actual && <span className="ml-1 text-xs font-normal text-yellow-800">· en curso</span>}
            </p>
          </li>
        );
      })}
    </ol>
  );
}

function Rastreo({ db, codigoExterno }) {
  const [valor, setValor] = useState('');
  const [res, setRes] = useState(null);
  const [error, setError] = useState('');

  useEffect(() => {
    if (codigoExterno) { setValor(codigoExterno); buscar(codigoExterno); }
  }, [codigoExterno]);

  const buscar = (code) => {
    const c = (code || valor).trim().toUpperCase();
    if (!c) { setError('Escribe tu código de rastreo.'); setRes(null); return; }
    const r = db[c];
    if (r) { setRes({ ...r, codigo: c }); setError(''); }
    else { setRes(null); setError('No encontramos el código ' + c + '. Revísalo en tu correo de confirmación: tiene el formato TRK-000.'); }
  };

  return (
    <section id="rastreo" className="scroll-mt-24">
      <Card className="p-5 sm:p-7">
        <div className="flex flex-col gap-4 lg:flex-row lg:items-end lg:justify-between">
          <div>
            <h2 className="font-display text-2xl text-foreground">Rastrear un trámite</h2>
            <p className="mt-1 max-w-measure text-sm text-muted-foreground">Ingresa el código que te dimos al iniciar la solicitud y verás en qué etapa va.</p>
          </div>
          <div className="flex w-full gap-2 lg:w-auto">
            <div className="flex-1 lg:w-64">
              <label htmlFor="track" className="sr-only">Código de rastreo</label>
              <Input id="track" value={valor} placeholder="TRK-001" className="uppercase"
                aria-describedby={error ? 'track-error' : undefined} invalid={!!error}
                onChange={e => { setValor(e.target.value); setError(''); }}
                onKeyDown={e => { if (e.key === 'Enter') buscar(); }} />
            </div>
            <Button onClick={() => buscar()} className="shrink-0">Buscar</Button>
          </div>
        </div>

        {!res && !error && (
          <p className="mt-4 text-xs text-muted-foreground">
            ¿Solo estás explorando? Prueba con{' '}
            {['TRK-001', 'TRK-002', 'TRK-003'].map((c, i) => (
              <React.Fragment key={c}>
                {i > 0 && ', '}
                <button onClick={() => { setValor(c); buscar(c); }} className={cn('rounded font-medium text-foreground underline underline-offset-2', focusRing)}>{c}</button>
              </React.Fragment>
            ))}.
          </p>
        )}

        {error && <p id="track-error" role="alert" className="mt-4 rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-800">{error}</p>}

        <AnimatePresence>
          {res && (
            <motion.div initial={{ opacity: 0, y: -6 }} animate={{ opacity: 1, y: 0 }} exit={{ opacity: 0 }} transition={{ duration: .34, ease: smoothEase }}
              className="mt-6 border-t border-border pt-6" aria-live="polite">
              <div className="flex flex-wrap items-baseline justify-between gap-2">
                <h3 className="font-display text-xl text-foreground">{res.codigo} · {res.servicio}</h3>
                <span className="text-xs text-muted-foreground">Actualizado el {res.actualizado}</span>
              </div>
              <p className="mt-1 text-sm text-muted-foreground">{res.cliente} · Documento emitido en {res.pais}</p>

              <Progreso etapa={res.etapa} />

              <div className="mt-5 grid gap-3 sm:grid-cols-2">
                <div className="rounded-lg bg-background p-4">
                  <p className="text-xs font-medium text-muted-foreground">Estado</p>
                  <p className="mt-1 text-sm text-foreground">{res.nota}</p>
                </div>
                <div className="rounded-lg bg-background p-4">
                  <p className="text-xs font-medium text-muted-foreground">{res.guia ? 'Número de guía' : 'Entrega estimada'}</p>
                  <p className="mt-1 text-sm text-foreground">{res.guia || res.fechaEstimada}</p>
                </div>
              </div>

              {res.pendiente && (
                <div className="mt-3 rounded-lg border border-accent/40 bg-yellow-50 p-4">
                  <p className="text-sm font-semibold text-yellow-800">Necesitamos algo de tu parte</p>
                  <p className="mt-1 text-sm text-foreground">{res.pendiente}</p>
                </div>
              )}
            </motion.div>
          )}
        </AnimatePresence>
      </Card>
    </section>
  );
}

function Contacto() {
  const [f, setF] = useState({ nombre: '', email: '', asunto: '', mensaje: '', contacto: 'whatsapp' });
  const [sug, setSug] = useState({ email: '', mensaje: '' });
  const [err, setErr] = useState({});
  const [sugErr, setSugErr] = useState({});
  const [enviado, setEnviado] = useState(false);
  const [sugEnviado, setSugEnviado] = useState(false);
  
  const set = (k, v) => { setF(p => ({ ...p, [k]: v })); setErr(e => ({ ...e, [k]: null })); };
  const setS = (k, v) => { setSug(p => ({ ...p, [k]: v })); setSugErr(e => ({ ...e, [k]: null })); };

  const enviar = () => {
    const e = {};
    if (f.nombre.trim().length < 3) e.nombre = 'Escribe tu nombre completo.';
    if (!emailOk(f.email)) e.email = 'Revisa el correo: falta el @ o el dominio.';
    if (!f.asunto) e.asunto = 'Elige un asunto para dirigir tu mensaje.';
    if (f.mensaje.trim().length < 10) e.mensaje = 'Cuéntanos un poco más para poder ayudarte.';
    setErr(e);
    if (Object.keys(e).length) return;
    setEnviado(true);
  };

  const enviarSugerencia = () => {
    const e = {};
    if (sug.email && !emailOk(sug.email)) e.email = 'Correo inválido.';
    if (sug.mensaje.trim().length < 5) e.mensaje = 'Por favor, escribe tu sugerencia.';
    setSugErr(e);
    if (Object.keys(e).length) return;
    setSugEnviado(true);
  };

  return (
    <div className="mx-auto max-w-6xl px-4 py-16 sm:px-6">
      <PageHeader id="contacto-titulo" eyebrow="Estamos para ayudarte" align="center" title="Contacto" description="¿Tu caso no encaja en la lista? Escríbenos y lo revisamos contigo." />

      <section aria-labelledby="contacto-titulo" className="mt-12 grid gap-12 lg:grid-cols-5">
        
        {/* Formulario Principal */}
        <div className="lg:col-span-3">
          {enviado ? (
            <Card className="p-8 text-center h-full flex flex-col justify-center items-center">
              <h2 className="font-display text-2xl text-foreground">Mensaje enviado</h2>
              <p className="mt-3 text-muted-foreground">Te responderemos a {f.email} dentro de las próximas 24 horas hábiles.</p>
              <Button variant="outline" className="mt-6" onClick={() => { setEnviado(false); setF({ nombre: '', email: '', asunto: '', mensaje: '', contacto: 'whatsapp' }); }}>Escribir otro mensaje</Button>
            </Card>
          ) : (
            <Card className="p-6 sm:p-8">
              <h2 className="font-display text-2xl text-foreground mb-6">Escríbenos</h2>
              <div className="grid gap-6 sm:gap-8 sm:grid-cols-2">
                <Field id="c-nombre" label="Nombre completo" error={err.nombre}>
                  <Input id="c-nombre" value={f.nombre} invalid={!!err.nombre} autoComplete="name" onChange={e => set('nombre', e.target.value)} />
                </Field>
                <Field id="c-email" label="Correo electrónico" error={err.email}>
                  <Input id="c-email" type="email" value={f.email} invalid={!!err.email} autoComplete="email" onChange={e => set('email', e.target.value)} />
                </Field>
              </div>
              <div className="mt-4">
                <Field id="c-asunto" label="Asunto" error={err.asunto}>
                  <Select id="c-asunto" value={f.asunto} invalid={!!err.asunto} onChange={e => set('asunto', e.target.value)}>
                    <option value="">Elige un asunto</option>
                    <option>Consulta general</option>
                    <option>Cotización de un trámite</option>
                    <option>Seguimiento de un trámite en curso</option>
                    <option>Alianza para bufetes</option>
                  </Select>
                </Field>
              </div>
              <div className="mt-4">
                <Field id="c-msg" label="Mensaje" error={err.mensaje}>
                  <Textarea id="c-msg" value={f.mensaje} onChange={e => set('mensaje', e.target.value)} placeholder="Cuéntanos qué documento necesitas y para cuándo." />
                </Field>
              </div>
              <div className="mt-6 flex justify-end">
                <Button onClick={enviar}>Enviar mensaje</Button>
              </div>
            </Card>
          )}
        </div>

        {/* Formulario de Sugerencias */}
        <div className="lg:col-span-2">
          {sugEnviado ? (
            <Card className="p-8 text-center bg-background border-border">
              <h2 className="font-display text-xl text-foreground">¡Gracias por tu sugerencia!</h2>
              <p className="mt-3 text-sm text-muted-foreground">Valoramos mucho tus comentarios para seguir mejorando.</p>
              <Button variant="outline" size="sm" className="mt-6" onClick={() => { setSugEnviado(false); setSug({ email: '', mensaje: '' }); }}>Enviar otra</Button>
            </Card>
          ) : (
            <Card className="p-6 sm:p-8 bg-background border-border">
              <h2 className="font-display text-xl text-foreground">Buzón de sugerencias</h2>
              <p className="mt-2 text-sm text-muted-foreground mb-6">Ayúdanos a mejorar. Déjanos tus comentarios, quejas o sugerencias.</p>
              <div className="space-y-4">
                <Field id="s-email" label="Correo (Opcional)" error={sugErr.email}>
                  <Input id="s-email" type="email" value={sug.email} invalid={!!sugErr.email} onChange={e => setS('email', e.target.value)} placeholder="Solo si deseas respuesta" />
                </Field>
                <Field id="s-msg" label="Sugerencia" error={sugErr.mensaje}>
                  <Textarea id="s-msg" className="min-h-[80px]" value={sug.mensaje} onChange={e => setS('mensaje', e.target.value)} placeholder="¿Qué podemos hacer mejor?" />
                </Field>
                <div className="mt-4">
                  <Button variant="outline" className="w-full" onClick={enviarSugerencia}>Enviar sugerencia</Button>
                </div>
              </div>
            </Card>
          )}
        </div>

      </section>
    </div>
  );
}
