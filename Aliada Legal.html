const poderFlag = (txt = '') => {
  const t = txt.trim().toLowerCase();
  if (t.startsWith('no aplica')) return 'na';
  if (t.startsWith('es el poder')) return 'na';
  if (t.startsWith('depende')) return 'depende';
  if (t.startsWith('no')) return 'no';
  if (t.startsWith('sí') || t.startsWith('si')) return 'si';
  return 'depende';
};

// Requisitos concretos para la combinación país + documento elegida en el asistente
function resolverRequisitos(pais, documento) {
  if (!pais || !documento) return null;
  const c = countryData[pais];
  if (!c) return null;
  if (documento === 'Antecedentes penales')
    return { tramite: c.antecedentes.tramite, poder: c.antecedentes.poder, requisitos: c.antecedentes.requisitos };
  if (documento === 'Partida de nacimiento')
    return { tramite: `Institución: ${c.nacimiento.institucion}`, poder: c.nacimiento.poder, requisitos: c.nacimiento.requisitos };
  if (documento === 'Poder notarial')
    return { tramite: `Se otorga ante: ${c.poderNotarial.donde}`, poder: 'Es el poder mismo — lo otorgas tú directamente', requisitos: 'Identificación vigente, datos del apoderado y descripción específica de los actos que autorizas' };
  const g = generalDocumentsData.find(d => d.documento === documento);
  return g ? { tramite: g.tramite, poder: g.poder, requisitos: g.requisitos } : null;
}

// Campo de teléfono: inicializa y destruye intl-tel-input según se monta/desmonta
function PhoneField({ id, value, onChange, invalid }) {
  const ref = useRef(null);
  const iti = useRef(null);
  useEffect(() => {
    if (!ref.current || !window.intlTelInput) return;
    iti.current = window.intlTelInput(ref.current, {
      initialCountry: 'sv',
      onlyCountries: ['sv', 'mx', 'gt', 'hn', 'co', 'ec', 'pe', 'ar'],
      separateDialCode: true,
      utilsScript: 'https://cdn.jsdelivr.net/npm/intl-tel-input@23.0.12/build/js/utils.js'
    });
    const el = ref.current;
    const handler = () => onChange(iti.current && iti.current.getNumber ? (iti.current.getNumber() || el.value) : el.value);
    el.addEventListener('countrychange', handler);
    return () => { el.removeEventListener('countrychange', handler); if (iti.current) iti.current.destroy(); };
  }, []);
  return (
    <input
      ref={ref} id={id} type="tel" inputMode="tel" defaultValue={value}
      onChange={(e) => onChange(iti.current && iti.current.getNumber ? (iti.current.getNumber() || e.target.value) : e.target.value)}
      className={inputCls(invalid)}
    />
  );
}

/* =========================================================================
   ASISTENTE DE SOLICITUD (3 pasos)
   ========================================================================= */

const PASOS = ['Qué necesitas', 'Cómo te contactamos', 'Listo'];

function Asistente({ onNuevoTramite, onRastrear }) {
  const [paso, setPaso] = useState(0);
  const [f, setF] = useState({ pais: '', documento: '', nombre: '', email: '', telefono: '', contacto: 'whatsapp', mensaje: '' });
  const [err, setErr] = useState({});
  const [codigo, setCodigo] = useState(null);
  const encabezado = useRef(null);

  const set = (k, v) => { setF(p => ({ ...p, [k]: v })); setErr(e => ({ ...e, [k]: null })); };
  // El foco viaja al encabezado del paso para que el lector de pantalla anuncie el cambio
  useEffect(() => { if (paso > 0 && encabezado.current) encabezado.current.focus({ preventScroll: true }); }, [paso]);
  const req = useMemo(() => resolverRequisitos(f.pais, f.documento), [f.pais, f.documento]);

  const avanzar = () => {
    const e = {};
    if (!f.pais) e.pais = 'Elige el país donde se emitió el documento.';
    if (!f.documento) e.documento = 'Elige qué documento necesitas.';
    setErr(e);
    if (Object.keys(e).length) return;
    setPaso(1);
  };

  const enviar = () => {
    const e = {};
    if (f.nombre.trim().length < 3) e.nombre = 'Escribe tu nombre completo.';
    if (!emailOk(f.email)) e.email = 'Revisa el correo: falta el @ o el dominio.';
    if (f.telefono.replace(/\D/g, '').length < 7) e.telefono = 'Escribe un número donde podamos escribirte.';
    setErr(e);
    if (Object.keys(e).length) return;
    const code = nuevoCodigo();
    onNuevoTramite(code, {
      cliente: f.nombre, pais: f.pais,
      servicio: f.documento, etapa: 0,
      actualizado: hoy(), fechaEstimada: fechaEstimada(),
      nota: 'Un asesor revisará tu caso y te escribirá por ' + (f.contacto === 'whatsapp' ? 'WhatsApp' : 'correo') + ' en menos de 24 horas.'
    });
    setCodigo(code);
    setPaso(2);
  };

  return (
    <Card id="solicitud" className="scroll-mt-24 overflow-hidden shadow-[0_18px_50px_-24px_rgba(0,38,74,.45)]">
      {/* Indicador de progreso */}
      <div className="flex items-center gap-2 border-b border-gray-200 bg-gray-50 px-5 py-3 sm:px-7">
        {PASOS.map((p, i) => (
          <React.Fragment key={p}>
            <div className="flex items-center gap-2">
              <span className={cn('flex h-6 w-6 shrink-0 items-center justify-center rounded-full text-xs font-semibold',
                i < paso ? 'bg-[#003B73] text-white' : i === paso ? 'bg-[#F2A900] text-[#002a52]' : 'bg-white text-gray-500 border border-gray-200')}>
                {i < paso ? '✓' : i + 1}
              </span>
              <span className={cn('text-xs sm:text-sm', i === paso ? 'font-semibold text-gray-900' : 'text-gray-500', i !== paso && 'hidden sm:inline')}>{p}</span>
            </div>
            {i < PASOS.length - 1 && <span className="h-px flex-1 bg-line" aria-hidden="true" />}
          </React.Fragment>
        ))}
      </div>

      <div className="p-5 sm:p-7">
        <AnimatePresence mode="wait">
          {paso === 0 && (
            <motion.div key="p0" initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }} transition={{ duration: .18 }}>
              <h2 ref={encabezado} tabIndex={-1} className="font-display text-xl text-gray-900 sm:text-2xl">Empecemos por el documento</h2>
              <p className="mt-1 max-w-measure text-sm text-gray-500">Dinos qué necesitas y te mostramos, antes de pedirte nada más, qué hace falta para conseguirlo.</p>

              <div className="mt-5 grid gap-4 sm:grid-cols-2">
                <Field id="w-pais" label="País que emite el documento" error={err.pais}>
                  <Select id="w-pais" value={f.pais} invalid={!!err.pais} onChange={e => set('pais', e.target.value)}>
                    <option value="">Elige un país</option>
                    {PAISES.map(p => <option key={p}>{p}</option>)}
                  </Select>
                </Field>
                <Field id="w-doc" label="Documento que necesitas" error={err.documento}>
                  <Select id="w-doc" value={f.documento} invalid={!!err.documento} onChange={e => set('documento', e.target.value)}>
                    <option value="">Elige un documento</option>
                    {DOCUMENTOS.map(d => <option key={d}>{d}</option>)}
                  </Select>
                </Field>
              </div>

              <AnimatePresence>
                {req && (
                  <motion.div initial={{ opacity: 0, height: 0 }} animate={{ opacity: 1, height: 'auto' }} exit={{ opacity: 0, height: 0 }}
                    transition={{ duration: .22 }} className="overflow-hidden">
                    <div className="mt-5 rounded-lg border border-[#003B73]/15 bg-blue-50 p-4" aria-live="polite">
                      <div className="flex flex-wrap items-center gap-2">
                        <Badge tone={poderFlag(req.poder)}>{FLAG_META[poderFlag(req.poder)].label}</Badge>
                        <span className="text-xs text-[#003B73]/70">{f.documento} · {f.pais}</span>
                      </div>
                      <dl className="mt-3 space-y-2 text-sm">
                        <div><dt className="font-medium text-gray-900">Cómo se tramita</dt><dd className="text-gray-500">{req.tramite}</dd></div>
                        <div><dt className="font-medium text-gray-900">Lo que tendrás que darnos</dt><dd className="text-gray-500">{req.requisitos}</dd></div>
                      </dl>
                    </div>
                  </motion.div>
                )}
              </AnimatePresence>

              <div className="mt-6 flex flex-col gap-3 sm:flex-row sm:items-center">
                <Button variant="accent" size="lg" onClick={avanzar} className="sm:w-auto">Continuar</Button>
                <p className="text-xs text-gray-500">2 pasos más. Toma menos de un minuto y no compromete a nada.</p>
              </div>
            </motion.div>
          )}

          {paso === 1 && (
            <motion.div key="p1" initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }} transition={{ duration: .18 }}>
              <h2 ref={encabezado} tabIndex={-1} className="font-display text-xl text-gray-900 sm:text-2xl">¿Cómo te contactamos?</h2>
              <p className="mt-1 text-sm text-gray-500">
                {f.documento} de {f.pais}. <button onClick={() => setPaso(0)} className={cn('text-[#003B73] underline underline-offset-4 rounded', focusRing)}>Cambiar</button>
              </p>

              <div className="mt-5 grid gap-4 sm:grid-cols-2">
                <Field id="w-nombre" label="Nombre completo" error={err.nombre}>
                  <Input id="w-nombre" value={f.nombre} invalid={!!err.nombre} autoComplete="name"
                    placeholder="Como aparece en tu identificación" onChange={e => set('nombre', e.target.value)} />
                </Field>
                <Field id="w-email" label="Correo electrónico" error={err.email}>
                  <Input id="w-email" type="email" value={f.email} invalid={!!err.email} autoComplete="email"
                    placeholder="tucorreo@ejemplo.com" onChange={e => set('email', e.target.value)} />
                </Field>
                <Field id="w-tel" label="Teléfono" hint="Incluye el código del país donde vives." error={err.telefono}>
                  <PhoneField id="w-tel" value={f.telefono} invalid={!!err.telefono} onChange={v => set('telefono', v)} />
                </Field>
                <fieldset>
                  <legend className="text-sm font-medium text-gray-900">Prefieres que te escribamos por</legend>
                  <div className="mt-2 grid grid-cols-2 gap-2">
                    {[['whatsapp', 'WhatsApp'], ['email', 'Correo']].map(([v, l]) => (
                      <label key={v} className={cn('flex cursor-pointer items-center gap-2 rounded-lg border px-3 py-2.5 text-sm transition-colors',
                        f.contacto === v ? 'border-[#003B73] bg-blue-50 font-medium text-[#003B73]' : 'border-gray-200 hover:border-[#003B73]/30')}>
                        <input type="radio" id={`contacto-${v}`} name="contacto" value={v} checked={f.contacto === v}
                          onChange={() => set('contacto', v)} className="h-4 w-4 accent-[#003B73]" />
                        {l}
                      </label>
                    ))}
                  </div>
                </fieldset>
              </div>

              <div className="mt-4">
                <Field id="w-msg" label="Algo que debamos saber" hint="Opcional: fechas límite, nombres exactos, si ya intentaste el trámite.">
                  <Textarea id="w-msg" value={f.mensaje} onChange={e => set('mensaje', e.target.value)} placeholder="Ej. Necesito el documento antes del 10 de octubre para una cita consular." />
                </Field>
              </div>

              <div className="mt-6 flex flex-col-reverse gap-3 sm:flex-row sm:items-center">
                <Button variant="outline" onClick={() => setPaso(0)}>Volver</Button>
                <Button variant="accent" size="lg" onClick={enviar}>Enviar solicitud</Button>
                <p className="text-xs text-gray-500 sm:ml-2">Usamos tus datos solo para gestionar el trámite.</p>
              </div>
            </motion.div>
          )}

          {paso === 2 && (
            <motion.div key="p2" initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }} transition={{ duration: .18 }} aria-live="polite">
              <div className="flex items-start gap-3">
                <span className="mt-0.5 flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-emerald-50 text-emerald-700" aria-hidden="true">
                  <svg className="h-5 w-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7" /></svg>
                </span>
                <div>
                  <h2 ref={encabezado} tabIndex={-1} className="font-display text-xl text-gray-900 sm:text-2xl">Solicitud registrada</h2>
                  <p className="mt-1 max-w-measure text-sm text-gray-500">
                    Guarda este código: con él puedes ver el estado del trámite en cualquier momento. También te lo enviamos a {f.email}.
                  </p>
                </div>
              </div>

              <div className="mt-5 flex flex-wrap items-center gap-3 rounded-lg border border-dashed border-[#003B73]/30 bg-blue-50 px-4 py-3">
                <span className="text-sm text-gray-500">Tu código</span>
                <strong className="font-display text-2xl tracking-wide text-[#003B73]">{codigo}</strong>
                <Button size="sm" variant="outline" onClick={() => {
                  navigator.clipboard && navigator.clipboard.writeText(codigo);
                  Swal.fire({ icon: 'success', title: 'Código copiado', confirmButtonColor: '#003B73', timer: 1400, showConfirmButton: false });
                }}>Copiar</Button>
              </div>

              <ol className="mt-5 space-y-2 text-sm text-gray-500">
                <li>1. Un asesor revisa tu caso y te escribe por {f.contacto === 'whatsapp' ? 'WhatsApp' : 'correo'} en menos de 24 horas.</li>
                <li>2. Te confirmamos el costo y los documentos que debes enviarnos.</li>
                <li>3. Gestionamos, apostillamos y enviamos con número de guía.</li>
              </ol>

              <div className="mt-6 flex flex-col gap-3 sm:flex-row">
                <Button onClick={() => onRastrear(codigo)}>Ver el estado ahora</Button>
                <Button variant="outline" onClick={() => { setPaso(0); setF({ pais: '', documento: '', nombre: '', email: '', telefono: '', contacto: 'whatsapp', mensaje: '' }); setCodigo(null); }}>
                  Solicitar otro documento
                </Button>
              </div>
            </motion.div>
          )}
        </AnimatePresence>
      </div>
    </Card>
  );
}

/* =========================================================================
   RASTREO
   ========================================================================= */

function Progreso({ etapa }) {
  return (
    <ol className="mt-5 space-y-0 sm:flex sm:space-y-0">
      {ETAPAS.map((e, i) => {
        const hecho = i < etapa, actual = i === etapa;
        return (
          <li key={e} className="relative flex gap-3 pb-5 last:pb-0 sm:flex-1 sm:flex-col sm:gap-2 sm:pb-0">
            <div className="flex flex-col items-center sm:w-full sm:flex-row">
              <span className={cn('z-10 flex h-7 w-7 shrink-0 items-center justify-center rounded-full border-2 text-xs font-semibold',
                hecho ? 'border-[#003B73] bg-[#003B73] text-white' : actual ? 'border-[#F2A900] bg-[#F2A900] text-[#002a52]' : 'border-gray-200 bg-white text-gray-500')}>
                {hecho ? '✓' : i + 1}
              </span>
              <span className={cn('w-px flex-1 sm:h-px sm:w-full', i === ETAPAS.length - 1 ? 'bg-transparent' : hecho ? 'bg-[#003B73]' : 'bg-line')} aria-hidden="true" />
            </div>
            <p className={cn('pb-1 text-sm sm:pr-3', actual ? 'font-semibold text-gray-900' : hecho ? 'text-gray-900' : 'text-gray-500')}>
              {e}{actual && <span className="ml-1 text-xs font-normal text-yellow-800">· en curso</span>}
            </p>
          </li>
        );
      })}
    </ol>
  );
}

function Rastreo({ db, codigoExterno }) {
  const [valor, setValor] = useState('');
  const [res, setRes] = useState(null);
  const [error, setError] = useState('');

  useEffect(() => {
    if (codigoExterno) { setValor(codigoExterno); buscar(codigoExterno); }
  }, [codigoExterno]);

  const buscar = (code) => {
    const c = (code || valor).trim().toUpperCase();
    if (!c) { setError('Escribe tu código de rastreo.'); setRes(null); return; }
    const r = db[c];
    if (r) { setRes({ ...r, codigo: c }); setError(''); }
    else { setRes(null); setError('No encontramos el código ' + c + '. Revísalo en tu correo de confirmación: tiene el formato TRK-000.'); }
  };

  return (
    <section id="rastreo" className="scroll-mt-24">
      <Card className="p-5 sm:p-7">
        <div className="flex flex-col gap-4 lg:flex-row lg:items-end lg:justify-between">
          <div>
            <h2 className="font-display text-2xl text-gray-900">Rastrear un trámite</h2>
            <p className="mt-1 max-w-measure text-sm text-gray-500">Ingresa el código que te dimos al iniciar la solicitud y verás en qué etapa va.</p>
          </div>
          <div className="flex w-full gap-2 lg:w-auto">
            <div className="flex-1 lg:w-64">
              <label htmlFor="track" className="sr-only">Código de rastreo</label>
              <Input id="track" value={valor} placeholder="TRK-001" className="uppercase"
                aria-describedby={error ? 'track-error' : undefined} invalid={!!error}
                onChange={e => { setValor(e.target.value); setError(''); }}
                onKeyDown={e => { if (e.key === 'Enter') buscar(); }} />
            </div>
            <Button onClick={() => buscar()} className="shrink-0">Buscar</Button>
          </div>
        </div>

        {!res && !error && (
          <p className="mt-4 text-xs text-gray-500">
            ¿Solo estás explorando? Prueba con{' '}
            {['TRK-001', 'TRK-002', 'TRK-003'].map((c, i) => (
              <React.Fragment key={c}>
                {i > 0 && ', '}
                <button onClick={() => { setValor(c); buscar(c); }} className={cn('rounded font-medium text-[#003B73] underline underline-offset-2', focusRing)}>{c}</button>
              </React.Fragment>
            ))}.
          </p>
        )}

        {error && <p id="track-error" role="alert" className="mt-4 rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-800">{error}</p>}

        <AnimatePresence>
          {res && (
            <motion.div initial={{ opacity: 0, y: -6 }} animate={{ opacity: 1, y: 0 }} exit={{ opacity: 0 }} transition={{ duration: .2 }}
              className="mt-6 border-t border-gray-200 pt-6" aria-live="polite">
              <div className="flex flex-wrap items-baseline justify-between gap-2">
                <h3 className="font-display text-xl text-[#003B73]">{res.codigo} · {res.servicio}</h3>
                <span className="text-xs text-gray-500">Actualizado el {res.actualizado}</span>
              </div>
              <p className="mt-1 text-sm text-gray-500">{res.cliente} · Documento emitido en {res.pais}</p>

              <Progreso etapa={res.etapa} />

              <div className="mt-5 grid gap-3 sm:grid-cols-2">
                <div className="rounded-lg bg-gray-50 p-4">
                  <p className="text-xs font-medium text-gray-500">Estado</p>
                  <p className="mt-1 text-sm text-gray-900">{res.nota}</p>
                </div>
                <div className="rounded-lg bg-gray-50 p-4">
                  <p className="text-xs font-medium text-gray-500">{res.guia ? 'Número de guía' : 'Entrega estimada'}</p>
                  <p className="mt-1 text-sm text-gray-900">{res.guia || res.fechaEstimada}</p>
                </div>
              </div>

              {res.pendiente && (
                <div className="mt-3 rounded-lg border border-[#F2A900]/40 bg-yellow-50 p-4">
                  <p className="text-sm font-semibold text-yellow-800">Necesitamos algo de tu parte</p>
                  <p className="mt-1 text-sm text-gray-900">{res.pendiente}</p>
                </div>
              )}
            </motion.div>
          )}
        </AnimatePresence>
      </Card>
    </section>
  );
}

   GUÍA POR PAÍS

      <p className="mt-3 text-sm text-gray-500"><span className="font-medium text-gray-900">Detalle del poder: </span>{poder}</p>

}

function Contacto() {
  const [f, setF] = useState({ nombre: '', email: '', asunto: '', mensaje: '', contacto: 'whatsapp' });
  const [err, setErr] = useState({});
  const [enviado, setEnviado] = useState(false);
  const set = (k, v) => { setF(p => ({ ...p, [k]: v })); setErr(e => ({ ...e, [k]: null })); };
  // El foco viaja al encabezado del paso para que el lector de pantalla anuncie el cambio
  useEffect(() => { if (paso > 0 && encabezado.current) encabezado.current.focus({ preventScroll: true }); }, [paso]);

  const enviar = () => {
    const e = {};
    if (f.nombre.trim().length < 3) e.nombre = 'Escribe tu nombre completo.';
    if (!emailOk(f.email)) e.email = 'Revisa el correo: falta el @ o el dominio.';
    if (!f.asunto) e.asunto = 'Elige un asunto para dirigir tu mensaje.';
    if (f.mensaje.trim().length < 10) e.mensaje = 'Cuéntanos un poco más para poder ayudarte.';
    setErr(e);
    if (Object.keys(e).length) return;
    setEnviado(true);
  };

  if (enviado) return (
    <div className="mx-auto max-w-2xl px-4 py-24 text-center sm:px-6">
      <h1 className="font-display text-3xl text-gray-900">Mensaje enviado</h1>
      <p className="mt-3 text-gray-500">Te responderemos a {f.email} dentro de las próximas 24 horas hábiles.</p>
      <Button variant="outline" className="mt-6" onClick={() => { setEnviado(false); setF({ nombre: '', email: '', asunto: '', mensaje: '', contacto: 'whatsapp' }); }}>Escribir otro mensaje</Button>
    </div>
  );

  return (
    <div className="mx-auto max-w-2xl px-4 py-16 sm:px-6">
      <h1 className="font-display text-4xl text-gray-900">Contacto</h1>
      <p className="mt-3 text-gray-500">¿Tu caso no encaja en la lista? Escríbenos y lo revisamos contigo.</p>

      <Card className="mt-8 p-6 sm:p-8">
        <div className="grid gap-4 sm:grid-cols-2">
          <Field id="c-nombre" label="Nombre completo" error={err.nombre}>
            <Input id="c-nombre" value={f.nombre} invalid={!!err.nombre} autoComplete="name" onChange={e => set('nombre', e.target.value)} />
          </Field>
          <Field id="c-email" label="Correo electrónico" error={err.email}>
            <Input id="c-email" type="email" value={f.email} invalid={!!err.email} autoComplete="email" onChange={e => set('email', e.target.value)} />
          </Field>
        </div>
        <div className="mt-4">
          <Field id="c-asunto" label="Asunto" error={err.asunto}>
            <Select id="c-asunto" value={f.asunto} invalid={!!err.asunto} onChange={e => set('asunto', e.target.value)}>
              <option value="">Elige un asunto</option>
              <option>Consulta general</option>
              <option>Cotización de un trámite</option>
              <option>Seguimiento de un trámite en curso</option>
              <option>Alianza para bufetes</option>
            </Select>
          </Field>
        </div>
        <div className="mt-4">
          <Field id="c-msg" label="Mensaje" error={err.mensaje}>
            <Textarea id="c-msg" value={f.mensaje} onChange={e => set('mensaje', e.target.value)} placeholder="Cuéntanos qué documento necesitas y para cuándo." />
          </Field>
        </div>
        <Button variant="accent" size="lg" className="mt-6 w-full" onClick={enviar}>Enviar mensaje</Button>
      </Card>
    </div>
  );
}
